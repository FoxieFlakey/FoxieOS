[package]
name = "service_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
caps = "0.5.6"
clap = { version = "4.6.7", features = ["derive"] }
command-fds = "0.3.3"
enumflags2 = "0.7.12"
foxie_base = { version = "0.1.0", path = "../../system/foxie_base" }
libbinder = { version = "0.1.0", path = "../../libs/libbinder/libbinder" }
libbinder-basic = { version = "0.1.0", path = "../../libs/libbinder/extras/libbinder-basic", features = ["macros"] }
nix = { version = "0.31.3", features = ["event", "fs", "mount", "process", "sched", "signal", "time", "user"] }
openat = "0.1.21"
parking_lot = "0.12.5"
pidfd-util = { version = "0.1.0", path = "../../libs/pidfd-util" }
