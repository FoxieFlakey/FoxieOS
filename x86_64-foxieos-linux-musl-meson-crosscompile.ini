[binaries]
# Only LLVM based tols used
c     = 'clang'
cpp   = 'clang++'
ar    = 'llvm-ar'
strip = 'llvm-strip'
ranlib = 'llvm-ranlib'
pkg-config = 'pkg-config'
llvm-config = project_dir + '/extra/llvm-config.sh'

[built-in options]
# Pass the non-typical library and include paths directly to the compiler/linker
c_args       = ['-target', 'x86_64-unknown-linux-musl', '--sysroot=' + sysroot_path, '-I' + include_dir]
cpp_args     = ['-target', 'x86_64-unknown-linux-musl', '--sysroot=' + sysroot_path, '-I' + include_dir + '/c++/v1', '-I' + include_dir]
c_link_args  = ['--sysroot=' + sysroot_path, '-stdlib=libc++', '--rtlib=compiler-rt', '-B' + sysroot_path + '/system/lib', '-L' + sysroot_path + '/system/lib', '-Wl,-rpath,/system/lib', '-Wl,-dynamic-linker=/system/lib/ld-musl-x86_64.so.1']
cpp_link_args = ['--sysroot=' + sysroot_path, '-stdlib=libc++', '--rtlib=compiler-rt', '-B' + sysroot_path + '/system/lib', '-L' + sysroot_path + '/system/lib', '-Wl,-rpath,/system/lib', '-Wl,-dynamic-linker=/system/lib/ld-musl-x86_64.so.1']

[properties]
pkg_config_static = false
sys_root = sysroot_path
pkg_config_pkgdatadir = dev_sysroot_path + '/system/share/pkgconfig'
pkg_config_libdir = dev_sysroot_path + '/system/lib/pkgconfig'

[host_machine]
system     = 'linux'
cpu_family = 'x86_64'
cpu        = 'x86_64'
endian     = 'little'